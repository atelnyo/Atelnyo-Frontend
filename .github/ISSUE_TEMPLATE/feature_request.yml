name: ✨ Feature Request
description: Suggest an idea or improvement for the Atelnyo frontend
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! Please describe the problem you're trying to solve — not just the solution you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and what's missing or frustrating today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to happen? Describe the behavior, not necessarily the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative solutions or workarounds you've thought of.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is a frontend (client-side) change — not a backend/API request
          required: true
        - label: I checked that this isn't already requested in existing issues
          required: true
