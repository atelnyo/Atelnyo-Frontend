<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14143a"/>
      <stop offset="55%" stop-color="#0d0d28"/>
      <stop offset="100%" stop-color="#200b40"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#e91e63" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#e91e63" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e91e63" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f06292"/>
      <stop offset="100%" stop-color="#b71c5e"/>
    </linearGradient>
    <linearGradient id="petalInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8a5c2"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
    <radialGradient id="center" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </radialGradient>
      <linearGradient id="sloganGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd54f"/>
      <stop offset="30%" stop-color="#fff3b0"/>
      <stop offset="55%" stop-color="#ffb300"/>
      <stop offset="80%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#ffd54f"/>
    </linearGradient>
    <filter id="sloganGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- decorative blurred dots -->
  <circle cx="1050" cy="120" r="90" fill="#e91e63" opacity="0.08"/>
  <circle cx="1120" cy="540" r="130" fill="#f06292" opacity="0.06"/>
  <circle cx="60" cy="560" r="70" fill="#d81b60" opacity="0.08"/>
  <!-- rose mark -->
  <g transform="translate(240,315)">
    <ellipse cx="0" cy="-52" rx="34" ry="68" fill="url(#petalOuter)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-52" rx="34" ry="68" fill="url(#petalOuter)" transform="rotate(60)"/>
    <ellipse cx="0" cy="-52" rx="34" ry="68" fill="url(#petalOuter)" transform="rotate(120)"/>
    <ellipse cx="0" cy="-52" rx="34" ry="68" fill="url(#petalOuter)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-52" rx="34" ry="68" fill="url(#petalOuter)" transform="rotate(240)"/>
    <ellipse cx="0" cy="-52" rx="34" ry="68" fill="url(#petalOuter)" transform="rotate(300)"/>
  </g>
  <g transform="translate(240,315)">
    <ellipse cx="0" cy="-32" rx="24" ry="50" fill="url(#petalInner)" transform="rotate(30)"/>
    <ellipse cx="0" cy="-32" rx="24" ry="50" fill="url(#petalInner)" transform="rotate(90)"/>
    <ellipse cx="0" cy="-32" rx="24" ry="50" fill="url(#petalInner)" transform="rotate(150)"/>
    <ellipse cx="0" cy="-32" rx="24" ry="50" fill="url(#petalInner)" transform="rotate(210)"/>
    <ellipse cx="0" cy="-32" rx="24" ry="50" fill="url(#petalInner)" transform="rotate(270)"/>
    <ellipse cx="0" cy="-32" rx="24" ry="50" fill="url(#petalInner)" transform="rotate(330)"/>
  </g>
  <circle cx="240" cy="315" r="28" fill="url(#center)"/>
  <circle cx="232" cy="307" r="8" fill="#ffffff" opacity="0.6"/>
  <!-- wordmark -->
  <text x="430" y="300" font-family="Poppins, Inter, system-ui, sans-serif" font-size="96" font-weight="800" letter-spacing="6" fill="#ffffff">ATELNYO</text>
  <rect x="434" y="330" width="72" height="6" rx="3" fill="url(#petalInner)"/>
  <text x="434" y="400" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="400" fill="#9d8bb5">Explora · Cursos · Música · Talento y Más</text>
</svg>
