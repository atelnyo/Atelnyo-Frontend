<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 192 192">
  <defs>
    <!-- Deep cosmic background -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16163a"/>
      <stop offset="55%" stop-color="#0d0d28"/>
      <stop offset="100%" stop-color="#200b40"/>
    </linearGradient>
    <!-- Rose glow behind the flower -->
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0%" stop-color="#e91e63" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#e91e63" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e91e63" stop-opacity="0"/>
    </radialGradient>
    <!-- Outer petals (deep rose) -->
    <linearGradient id="petalOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f06292"/>
      <stop offset="100%" stop-color="#b71c5e"/>
    </linearGradient>
    <!-- Inner petals (bright rose) -->
    <linearGradient id="petalInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8a5c2"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
    <!-- Gold center -->
    <radialGradient id="center" cx="0.5" cy="0.38" r="0.7">
      <stop offset="0%" stop-color="#ffe082"/>
      <stop offset="100%" stop-color="#ff8f00"/>
    </radialGradient>
  </defs>

  <!-- Full-bleed square so corners never render white behind the OS mask -->
  <rect width="192" height="192" fill="url(#bg)"/>
  <rect width="192" height="192" rx="40" fill="url(#glow)"/>

  <!-- Soft ground shadow under the flower -->
  <ellipse cx="96" cy="118" rx="30" ry="9" fill="#000" opacity="0.35"/>

  <!-- Outer petal ring -->
  <g transform="translate(96,88)">
    <ellipse cx="0" cy="-20" rx="13" ry="26" fill="url(#petalOuter)" transform="rotate(0)"/>
    <ellipse cx="0" cy="-20" rx="13" ry="26" fill="url(#petalOuter)" transform="rotate(60)"/>
    <ellipse cx="0" cy="-20" rx="13" ry="26" fill="url(#petalOuter)" transform="rotate(120)"/>
    <ellipse cx="0" cy="-20" rx="13" ry="26" fill="url(#petalOuter)" transform="rotate(180)"/>
    <ellipse cx="0" cy="-20" rx="13" ry="26" fill="url(#petalOuter)" transform="rotate(240)"/>
    <ellipse cx="0" cy="-20" rx="13" ry="26" fill="url(#petalOuter)" transform="rotate(300)"/>
  </g>

  <!-- Inner petal ring (offset rotation, brighter) -->
  <g transform="translate(96,88)">
    <ellipse cx="0" cy="-12" rx="9" ry="19" fill="url(#petalInner)" transform="rotate(30)"/>
    <ellipse cx="0" cy="-12" rx="9" ry="19" fill="url(#petalInner)" transform="rotate(90)"/>
    <ellipse cx="0" cy="-12" rx="9" ry="19" fill="url(#petalInner)" transform="rotate(150)"/>
    <ellipse cx="0" cy="-12" rx="9" ry="19" fill="url(#petalInner)" transform="rotate(210)"/>
    <ellipse cx="0" cy="-12" rx="9" ry="19" fill="url(#petalInner)" transform="rotate(270)"/>
    <ellipse cx="0" cy="-12" rx="9" ry="19" fill="url(#petalInner)" transform="rotate(330)"/>
  </g>

  <!-- Gold center + highlight -->
  <circle cx="96" cy="88" r="10.5" fill="url(#center)"/>
  <circle cx="93" cy="85" r="3" fill="#ffffff" opacity="0.6"/>

  <!-- Wordmark -->
  <text x="96" y="163" text-anchor="middle" font-family="Poppins, Inter, system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="2.5" fill="#ffffff">ATELNYO</text>
</svg>
