    <!-- ─── Dev-mode SW unregister (synchronous, before any module) ──────────
         Phase 56.1 — Defensive fix for the recurring
         "Cannot read properties of null (reading 'useState')" crash on
         lazy-loaded routes (CreatorAnalytics, AdminDashboard, etc.) in
         GitHub Codespaces. The previous post-render unregister in
         main.jsx fired too late — the SW intercepted the first lazy
         chunk fetch with a cache-first hit, serving a stale chunk
         bundled against a now-invalid React reference. This inline
         script runs DURING HTML PARSING, before any module scripts
         (including main.jsx) execute, so the SW is gone before
         React even tries to mount.

         The registration script in <body> below checks
         ``window.__atelnyo_isDev`` and skips re-registration in dev,
         so the SW can't immediately undo this unregister. The
         CACHE_VERSION in public/sw.js was bumped to ``v3`` in the
         same change so existing sessions stuck on the cached
         ``v2`` HTML purge cleanly on the first hard reload.

         Zero prod risk: ``isDev`` is only true for localhost,
         127.0.0.1, *.github.dev, and *.gitpod.io hostnames — none
         of         which match the production domain (atelnyo.site),
         so the prod SW registration runs normally. -->
    <script>
      if ('serviceWorker' in navigator) {
        var isDev = (
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          location.hostname === '0.0.0.0' ||
          location.hostname === '::1' ||
          location.hostname.includes('.github.dev') ||
          location.hostname.includes('.gitpod.io') ||
          location.hostname.includes('.cloudshell.dev')
        );
        if (isDev) {
          // Synchronous getRegistrations() (returns a Promise) +
          // best-effort unregister. The async tick is acceptable
          // because the <body> registration script below ALSO skips
          // in dev — so even if the unregister race loses, no NEW
          // SW will take control. Worst case: one hard reload
          // needed for the very first cached visit.
          navigator.serviceWorker.getRegistrations()
            .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
            .catch(function () { /* silans — SW API pa disponib */ });
        }
        // Only set the flag when isDev=true; the <body> registration
        // script's ``if (window.__atelnyo_isDev) return;`` check
        // naturally evaluates ``undefined`` as falsy in prod, so
        // the prod registration runs as before. Cleaner than
        // polluting the global with ``window.__atelnyo_isDev = false``
        // on every production page load.
        if (isDev) window.__atelnyo_isDev = true;
      }
    </script>

    <!-- ─── Atelnyo storage migration (runs before ANY module) ────────
         One-time controlled migration of the legacy ``devrose_*``
         localStorage keys to the new ``atelnyo_*`` prefix. Idempotent:
         a key is copied only when the new key is absent, and the old
         key is left in place (never destroyed) so nothing is lost.
         Runs inline during HTML parsing so every module (ThemeContext,
         storage backends, settings) reads the new keys from the first
         render. ``devrose-handles`` (IndexedDB) and ``devrose-salt-v1``
         (crypto salt) are intentionally NOT migrated. -->
    <script>
      (function() {
        try {
          if (!window.localStorage) return;
          var keys = [];
          for (var i = 0; i < window.localStorage.length; i++) {
            var k = window.localStorage.key(i);
            if (k && k.indexOf('devrose_') === 0) keys.push(k);
          }
          for (var j = 0; j < keys.length; j++) {
            var oldK = keys[j];
            var newK = 'atelnyo_' + oldK.slice(8);
            if (window.localStorage.getItem(newK) === null) {
              window.localStorage.setItem(newK, window.localStorage.getItem(oldK));
            }
          }
        } catch (e) { /* storage unavailable — ignore */ }
      })();
    </script>
    <!-- ─── Dark mode pre-JS detection ───
         Applies body.dark-mode BEFORE the first CSS paint when the OS
         prefers dark, so users never see a white flash on dark devices.
         ThemeContext.jsx refines this (adds theme-amoled, etc.) on mount. -->
    <script>
      (function() {
        try {
          // Atelnyo migration: read the new key first, fall back to the
          // legacy devrose_* key so existing theme prefs survive the
          // brand transition (boot migration in main.jsx copies them).
          var stored = localStorage.getItem('atelnyo_theme_mode') || localStorage.getItem('devrose_theme_mode');
          if (!stored || stored === 'system') {
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.body.classList.add('dark-mode');
            }
          } else if (stored === 'dark' || stored === 'amoled' || stored === 'cyber' || stored === 'enterprise') {
            document.body.classList.add('dark-mode');
          }
        } catch(e) {}
      })();
    </script>

    <!-- ─── PWA Service Worker Registration ─────────────────────────── -->
    <!-- Registered inline (not in main.jsx) so the SW starts controlling
         the page before React boots. "load" event ensures the browser
         isn't blocked parsing the <script type="module"> above.

         Phase 56.1 — Skip registration when the inline dev-mode guard
         in <head> set ``window.__atelnyo_isDev = true``. Otherwise the
         SW would re-register itself on load, undoing the unregister
         and reintroducing the cache-first stale-chunk crash. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          // Dev-mode: the <head> unregister already wiped any stale SW;
          // re-registering here would bring the stale-cache problem
          // right back. Production keeps the existing flow.
          if (window.__atelnyo_isDev) return;
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              // If a worker was already waiting from a previous visit,
              // fire the update event immediately so the banner surfaces
              // on the current page load (not just on fresh updates).
              if (reg.waiting) {
                window.dispatchEvent(new CustomEvent('atelnyo:sw:update', {
                  detail: { waitingWorker: reg.waiting }
                }));
              }
              // Listen for future updates
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (!newWorker) return;
                newWorker.addEventListener('statechange', function() {
                  if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                    // Dispatch custom event so InstallPrompt.jsx can surface
                    // an "Update available — refresh" toast with a SKIP_WAITING
                    // button. The event carries the waiting worker so the
                    // React listener can call postMessage({type:'SKIP_WAITING'})
                    // and then reload.
                    window.dispatchEvent(new CustomEvent('atelnyo:sw:update', {
                      detail: { waitingWorker: newWorker }
                    }));
                  }
                });
              });
            })
            .catch(function(err) {
              console.warn('[PWA] SW registration failed:', err.message);
            });
        });
      }
    </script>
